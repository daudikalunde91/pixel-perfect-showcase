<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile — Crop Disease Detector</title>
    <meta name="description" content="View and edit your farmer account details.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>

<nav class="navbar site-navbar sticky-top app-topbar-mobile">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
            <span class="brand-badge"><i class="bi bi-tree-fill" aria-hidden="true"></i></span>
            <span class="brand-text" data-i18n="brand">Crop Disease Detector</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#appMenu"
                aria-controls="appMenu" aria-label="Open menu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="appMenu" aria-labelledby="appMenuLabel">
    <div class="offcanvas-header">
        <h2 class="offcanvas-title h6" id="appMenuLabel" data-i18n="brand">Crop Disease Detector</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body app-sidebar">
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-grid" aria-hidden="true"></i><span data-i18n="dashboard">Dashboard</span></a>
            <a class="nav-link" href="scan.html"><i class="bi bi-camera" aria-hidden="true"></i><span data-i18n="newScan">New Scan</span></a>
            <a class="nav-link" href="history.html"><i class="bi bi-clock-history" aria-hidden="true"></i><span data-i18n="scanHistory">Scan History</span></a>
            <a class="nav-link active" href="profile.html"><i class="bi bi-person" aria-hidden="true"></i><span data-i18n="profile">Profile</span></a>
            <a class="nav-link" href="#" data-action="logout"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span data-i18n="logout">Logout</span></a>
        </nav>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-3 col-xl-2 app-sidebar app-sidebar-desktop">
            <a class="navbar-brand d-flex align-items-center gap-2 mb-4" href="dashboard.html">
                <span class="brand-badge"><i class="bi bi-tree-fill" aria-hidden="true"></i></span>
                <span class="brand-text" data-i18n="brand">Crop Disease Detector</span>
            </a>
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="bi bi-grid" aria-hidden="true"></i><span data-i18n="dashboard">Dashboard</span></a>
                <a class="nav-link" href="scan.html"><i class="bi bi-camera" aria-hidden="true"></i><span data-i18n="newScan">New Scan</span></a>
                <a class="nav-link" href="history.html"><i class="bi bi-clock-history" aria-hidden="true"></i><span data-i18n="scanHistory">Scan History</span></a>
                <a class="nav-link active" href="profile.html"><i class="bi bi-person" aria-hidden="true"></i><span data-i18n="profile">Profile</span></a>
                <a class="nav-link" href="#" data-action="logout"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span data-i18n="logout">Logout</span></a>
            </nav>
        </aside>

        <main class="col-lg-9 col-xl-10 app-main">
            <h1 class="h3 mb-3" data-i18n="profile">Profile</h1>

            <div class="alert alert-success d-none" id="profile-saved" role="alert">
                Profile updated on this device.
            </div>

            <div class="card-soft" style="max-width: 640px;"><div class="card-body">
                <!-- FUTURE DJANGO API: GET/PUT /api/profile/ -->
                <form id="profile-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="fullName">Full Name</label>
                        <input class="form-control" type="text" id="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input class="form-control" type="tel" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="accountType">Account Type</label>
                        <input class="form-control" type="text" id="accountType" value="Farmer" readonly>
                    </div>
                    <button class="btn btn-green btn-lg-action" type="submit">Save Changes</button>
                </form>
            </div></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/language.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/mock-auth.js"></script>
<script src="../js/session.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
